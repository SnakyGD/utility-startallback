name: Generate signing key

on:
  workflow_dispatch:
    inputs:
      signer_name:
        description: "Name shown as the certificate signer"
        required: true
        type: string
      signer_email:
        description: "Optional email shown in the certificate"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate-signing-key:
    runs-on: windows-latest

    steps:
      - name: Generate and save signing certificate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          SIGNER_NAME: ${{ inputs.signer_name }}
          SIGNER_EMAIL: ${{ inputs.signer_email }}
          CHOSEN_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Set SECRETS_ADMIN_TOKEN with repository Secrets: Read and write permission.'
          }

          $name = $env:SIGNER_NAME.Trim()
          $email = $env:SIGNER_EMAIL.Trim()
          if ($name.Length -eq 0 -or $name.Length -gt 100 -or $name -match '[,=+<>#;"\\\x00-\x1f]') {
            throw 'Signer name must be 1-100 characters and cannot contain certificate subject separators or control characters.'
          }
          if ($email -ne '' -and ($email.Length -gt 254 -or $email -notmatch '^[^\s,@=+<>#;"\\]+@[^\s,@=+<>#;"\\]+\.[^\s,@=+<>#;"\\]+$')) {
            throw 'Signer email is invalid.'
          }
          $subject = "CN=$name"
          if ($email -ne '') {
            $subject += ", E=$email"
          }

          $password = $env:CHOSEN_PFX_PASSWORD
          if ([string]::IsNullOrWhiteSpace($password)) {
            throw 'Set the SIGNING_PFX_PASSWORD repository secret to your chosen password before generating the certificate.'
          }
          if ($password -match '[\r\n]') {
            throw 'The signing password must be a single line.'
          }
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force

          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -KeyAlgorithm RSA `
            -KeyLength 4096 `
            -KeyExportPolicy Exportable `
            -HashAlgorithm SHA256 `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddYears(3)

          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing-key.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          $pfxBase64 = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($pfxPath))
          Write-Output "::add-mask::$pfxBase64"
          gh secret set SIGNING_PFX_BASE64 --repo "$env:GITHUB_REPOSITORY" --body $pfxBase64
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to save SIGNING_PFX_BASE64.'
          }
